<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrowserMCP</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #07070f;
      --surface:   #0c0c18;
      --card:      #10101e;
      --border:    #1a1a2e;
      --border2:   #22223a;
      --accent:    #6366f1;
      --accent2:   #818cf8;
      --accent3:   #a5b4fc;
      --success:   #10b981;
      --error:     #ef4444;
      --warn:      #f59e0b;
      --text:      #e2e8f0;
      --text-2:    #94a3b8;
      --text-3:    #3f3f6e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Ambient background blobs ──────────────────────────── */
    .bg-blobs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.07;
    }
    .blob-1 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, #6366f1, transparent);
      top: -80px; left: -60px;
      animation: float1 12s ease-in-out infinite;
    }
    .blob-2 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, #818cf8, transparent);
      bottom: 100px; right: -40px;
      animation: float2 9s ease-in-out infinite;
    }
    .blob-3 {
      width: 160px; height: 160px;
      background: radial-gradient(circle, #a78bfa, transparent);
      top: 40%; left: 50%;
      animation: float3 14s ease-in-out infinite;
    }
    @keyframes float1 {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(30px,20px) scale(1.1); }
      66%      { transform: translate(-10px,30px) scale(0.95); }
    }
    @keyframes float2 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(-20px,-25px) scale(1.15); }
    }
    @keyframes float3 {
      0%,100% { transform: translate(-50%,-50%) scale(1); }
      40%      { transform: translate(-50%,-50%) translate(20px,-15px) scale(1.2); }
      70%      { transform: translate(-50%,-50%) translate(-15px,20px) scale(0.9); }
    }

    /* all real content sits above blobs */
    .header, .status-bar, .transcript-wrap,
    .steps-area, .controls { position: relative; z-index: 1; }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background: rgba(12,12,24,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #6366f1 0%, #a78bfa 100%);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 16px rgba(99,102,241,0.5);
      animation: logo-glow 3s ease-in-out infinite;
    }
    @keyframes logo-glow {
      0%,100% { box-shadow: 0 0 14px rgba(99,102,241,0.45); }
      50%      { box-shadow: 0 0 24px rgba(167,139,250,0.65); }
    }
    .logo-name {
      font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.4px;
    }
    .logo-name em {
      font-style: normal;
      background: linear-gradient(90deg, #818cf8, #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .model-badge {
      font-size: 10px; font-weight: 600; color: var(--accent3);
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 5px; padding: 2px 7px;
      letter-spacing: 0.4px;
      animation: badge-shine 4s ease-in-out infinite;
    }
    @keyframes badge-shine {
      0%,100% { border-color: rgba(99,102,241,0.25); }
      50%      { border-color: rgba(165,180,252,0.5); }
    }
    .header-actions { display: flex; gap: 5px; }
    .icon-btn {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border2);
      border-radius: 8px; color: var(--text-2);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: all 0.2s;
    }
    .icon-btn:hover { background: rgba(99,102,241,0.15); color: var(--text); border-color: rgba(99,102,241,0.4); transform: scale(1.05); }
    .icon-btn:active { transform: scale(0.93); }
    .icon-btn.spinning svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Status ──────────────────────────────────────────────── */
    .status-bar {
      padding: 6px 16px;
      background: rgba(10,10,20,0.7);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      font-size: 11.5px; font-weight: 500; color: var(--text-2);
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-3); flex-shrink: 0; transition: all 0.4s;
    }
    .status-dot.ready   { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-dot.running { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse-dot 1s ease-in-out infinite; }
    .status-dot.error   { background: var(--error); box-shadow: 0 0 8px var(--error); }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }

    /* ── Transcript ──────────────────────────────────────────── */
    .transcript-wrap {
      padding: 7px 16px; border-bottom: 1px solid var(--border);
      background: rgba(10,10,20,0.6); backdrop-filter: blur(8px);
      flex-shrink: 0; min-height: 36px; display: flex; align-items: center; gap: 8px;
    }
    .transcript-tag {
      font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--text-3); flex-shrink: 0;
    }
    .transcript-text {
      font-size: 12.5px; color: var(--text-2); flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color 0.2s;
    }
    .transcript-text.interim { color: var(--accent3); font-style: italic; }
    .transcript-text.has-text { color: var(--text); }

    /* ── Steps feed ──────────────────────────────────────────── */
    .steps-area {
      flex: 1; overflow-y: auto; padding: 10px 10px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .steps-area::-webkit-scrollbar { width: 3px; }
    .steps-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

    .step-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 8px 10px; border-radius: 10px; font-size: 12px; line-height: 1.5;
      color: var(--text-2); border: 1px solid transparent;
      animation: step-in 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes step-in {
      from { opacity: 0; transform: translateX(-10px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }
    .step-item.active {
      background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.2);
      color: var(--text);
    }
    .step-item.done   { color: var(--text-3); }
    .step-item.success {
      background: rgba(16,185,129,0.07); border-color: rgba(16,185,129,0.18);
      color: #6ee7b7;
    }
    .step-item.error {
      background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.2);
      color: #fca5a5;
    }
    .step-dot {
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; flex-shrink: 0; font-weight: 700;
    }
    .step-item.active  .step-dot { background: rgba(99,102,241,0.2); color: var(--accent3); animation: spin-dot 2s linear infinite; }
    .step-item.done    .step-dot { color: var(--text-3); }
    .step-item.success .step-dot { background: rgba(16,185,129,0.15); color: var(--success); }
    .step-item.error   .step-dot { background: rgba(239,68,68,0.15); color: var(--error); }
    @keyframes spin-dot {
      0%,100%{transform:scale(1)} 50%{transform:scale(1.2)}
    }
    .step-text { flex: 1; word-break: break-word; }

    /* ── Empty / idle state — animated orb ──────────────────── */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      pointer-events: none; padding-bottom: 20px;
    }
    .orb-wrap {
      position: relative; width: 100px; height: 100px;
      display: flex; align-items: center; justify-content: center;
    }
    /* pulsing rings */
    .orb-ring {
      position: absolute; border-radius: 50%;
      border: 1.5px solid rgba(99,102,241,0.25);
      animation: ring-out 3s ease-out infinite;
    }
    .orb-ring:nth-child(1) { width: 100%; height: 100%; animation-delay: 0s; }
    .orb-ring:nth-child(2) { width: 100%; height: 100%; animation-delay: 1s; }
    .orb-ring:nth-child(3) { width: 100%; height: 100%; animation-delay: 2s; }
    @keyframes ring-out {
      0%   { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    /* core orb */
    .orb-core {
      width: 64px; height: 64px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #818cf8, #6366f1 60%, #4338ca);
      box-shadow: 0 0 30px rgba(99,102,241,0.4), inset 0 0 20px rgba(165,180,252,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; position: relative; z-index: 1;
      animation: orb-breathe 3s ease-in-out infinite;
    }
    @keyframes orb-breathe {
      0%,100% { transform: scale(1);    box-shadow: 0 0 28px rgba(99,102,241,0.35); }
      50%      { transform: scale(1.06); box-shadow: 0 0 44px rgba(99,102,241,0.55); }
    }
    /* listening state — orb goes red */
    body.listening .orb-core {
      background: radial-gradient(circle at 35% 35%, #f87171, #ef4444 60%, #dc2626);
      box-shadow: 0 0 40px rgba(239,68,68,0.6);
      animation: orb-listen 0.6s ease-in-out infinite alternate;
    }
    body.listening .orb-ring { border-color: rgba(239,68,68,0.3); }
    @keyframes orb-listen {
      from { transform: scale(1.0); box-shadow: 0 0 30px rgba(239,68,68,0.5); }
      to   { transform: scale(1.12); box-shadow: 0 0 55px rgba(239,68,68,0.75); }
    }
    /* running state — orb goes amber */
    body.running .orb-core {
      background: radial-gradient(circle at 35% 35%, #fbbf24, #f59e0b 60%, #d97706);
      box-shadow: 0 0 40px rgba(245,158,11,0.55);
      animation: orb-think 1.2s ease-in-out infinite;
    }
    body.running .orb-ring { border-color: rgba(245,158,11,0.25); }
    @keyframes orb-think {
      0%,100% { transform: scale(1) rotate(0deg); }
      25%      { transform: scale(1.05) rotate(3deg); }
      75%      { transform: scale(1.03) rotate(-3deg); }
    }
    .empty-hint { font-size: 12px; color: var(--text-3); text-align: center; line-height: 1.6; max-width: 160px; }

    /* ── Controls ────────────────────────────────────────────── */
    .controls {
      padding: 12px 13px 14px;
      background: rgba(12,12,24,0.9); backdrop-filter: blur(16px);
      border-top: 1px solid var(--border); flex-shrink: 0;
      display: flex; flex-direction: column; gap: 10px;
    }
    .api-warning {
      display: none; padding: 8px 12px;
      background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25);
      border-radius: 8px; font-size: 11.5px; color: #fcd34d; text-align: center;
    }
    .api-warning a { color: #fcd34d; text-decoration: underline; cursor: pointer; }

    /* Mic button */
    .mic-btn {
      width: 100%; height: 52px; border-radius: 16px;
      border: none; cursor: pointer; font-size: 13.5px; font-weight: 600;
      letter-spacing: 0.3px; transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      color: #fff; position: relative; overflow: hidden;
      box-shadow: 0 6px 24px rgba(99,102,241,0.35);
    }
    /* shimmer sweep */
    .mic-btn::after {
      content: '';
      position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      animation: shimmer 3s ease-in-out infinite;
    }
    @keyframes shimmer { 0%{left:-100%} 50%,100%{left:150%} }

    .mic-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(99,102,241,0.45); }
    .mic-btn:active { transform: scale(0.97); }

    .mic-btn.listening {
      background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
      box-shadow: 0 6px 30px rgba(239,68,68,0.5);
      animation: btn-pulse 0.9s ease-in-out infinite alternate;
    }
    .mic-btn.listening::after { display: none; }
    @keyframes btn-pulse {
      from { box-shadow: 0 6px 24px rgba(239,68,68,0.4); }
      to   { box-shadow: 0 6px 40px rgba(239,68,68,0.7); transform: translateY(-1px); }
    }
    .mic-btn.disabled { background: var(--card); color: var(--text-3); box-shadow: none; cursor: not-allowed; }
    .mic-btn.disabled::after { display: none; }

    .mic-icon { font-size: 19px; position: relative; z-index: 1; }
    .mic-label { position: relative; z-index: 1; }

    /* Waveform */
    .waveform { display: none; gap: 3px; align-items: center; height: 22px; position: relative; z-index: 1; }
    .mic-btn.listening .waveform { display: flex; }
    .mic-btn.listening .mic-icon { display: none; }
    .waveform span {
      width: 3px; border-radius: 3px; background: rgba(255,255,255,0.9);
      animation: wave 0.6s ease-in-out infinite;
    }
    .waveform span:nth-child(1){height:7px; animation-delay:0s}
    .waveform span:nth-child(2){height:14px;animation-delay:0.1s}
    .waveform span:nth-child(3){height:22px;animation-delay:0.2s}
    .waveform span:nth-child(4){height:14px;animation-delay:0.3s}
    .waveform span:nth-child(5){height:7px; animation-delay:0.4s}
    @keyframes wave {
      0%,100%{transform:scaleY(0.4);opacity:0.5} 50%{transform:scaleY(1);opacity:1}
    }

    /* Text row */
    .text-row { display: flex; gap: 7px; }
    .text-input {
      flex: 1; background: var(--card); border: 1px solid var(--border2);
      border-radius: 11px; color: var(--text); font-size: 12.5px;
      padding: 9px 13px; outline: none; transition: all 0.2s; font-family: inherit;
    }
    .text-input::placeholder { color: var(--text-3); }
    .text-input:focus { border-color: var(--accent); background: #0d0d1f; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    .text-input:disabled { opacity: 0.35; }
    .action-btn {
      width: 38px; height: 38px; border-radius: 11px; border: none;
      cursor: pointer; font-size: 15px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .send-btn { background: linear-gradient(135deg, #6366f1, #818cf8); color: #fff; box-shadow: 0 3px 12px rgba(99,102,241,0.3); }
    .send-btn:hover { transform: scale(1.08); box-shadow: 0 4px 18px rgba(99,102,241,0.45); }
    .stop-btn { background: rgba(239,68,68,0.15); color: var(--error); border: 1px solid rgba(239,68,68,0.3); }
    .stop-btn:hover { background: rgba(239,68,68,0.25); transform: scale(1.08); }
  </style>
</head>
<body>

  <!-- Ambient background -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <span class="logo-name">Browser<em>MCP</em></span>
      <span class="model-badge" id="modelBadge">gpt-5.1</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" title="Click: refresh tab · Hold: reload extension">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Initialising…</span>
  </div>

  <!-- Transcript -->
  <div class="transcript-wrap">
    <span class="transcript-tag">Heard</span>
    <div class="transcript-text" id="transcriptEl">—</div>
  </div>

  <!-- Steps feed / Idle orb -->
  <div class="steps-area" id="stepsArea">
    <div class="empty-state" id="emptyState">
      <div class="orb-wrap">
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-core">🎙️</div>
      </div>
      <p class="empty-hint">Hold the mic and speak a command</p>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="api-warning" id="apiWarning">
      No API key — <a id="openOptionsLink">open Settings ⚙</a>
    </div>
    <button class="mic-btn" id="micBtn">
      <span class="mic-icon" id="micIcon">🎤</span>
      <div class="waveform"><span></span><span></span><span></span><span></span><span></span></div>
      <span id="micLabel">Hold to speak</span>
    </button>
    <div class="text-row">
      <input class="text-input" id="textInput" placeholder="Or type a command…" autocomplete="off" />
      <button class="action-btn send-btn" id="sendBtn" title="Send">↵</button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
