<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrowserMCP</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #07070e;
      --surface:   #0d0d1a;
      --card:      #111120;
      --border:    #1c1c30;
      --border2:   #252540;
      --accent:    #6366f1;
      --accent-dim:#6366f130;
      --accent-glow:rgba(99,102,241,0.35);
      --success:   #10b981;
      --error:     #ef4444;
      --warn:      #f59e0b;
      --text:      #e2e8f0;
      --text-2:    #94a3b8;
      --text-3:    #475569;
      --red-glow:  rgba(239,68,68,0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px 11px 16px;
      background: linear-gradient(135deg, #0d0d1a 0%, #0f0f20 100%);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 0 12px var(--accent-glow);
      flex-shrink: 0;
    }
    .logo-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .logo-name em {
      font-style: normal;
      background: linear-gradient(90deg, #6366f1, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .model-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid #6366f130;
      border-radius: 4px;
      padding: 2px 6px;
      letter-spacing: 0.3px;
      margin-left: 2px;
    }
    .header-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .icon-btn {
      width: 30px;
      height: 30px;
      background: none;
      border: 1px solid var(--border2);
      border-radius: 7px;
      color: var(--text-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--card); color: var(--text); border-color: var(--accent); }
    .icon-btn:active { transform: scale(0.93); }
    .icon-btn.spinning svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Status strip ──────────────────────────────────────── */
    .status-bar {
      padding: 7px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-2);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-3);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.ready   { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.running { background: var(--warn); animation: blink 1s ease-in-out infinite; }
    .status-dot.error   { background: var(--error); box-shadow: 0 0 6px var(--error); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
    #statusText { font-weight: 500; }

    /* ── Transcript ────────────────────────────────────────── */
    .transcript-wrap {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .transcript-tag {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-3);
      flex-shrink: 0;
    }
    .transcript-text {
      font-size: 12.5px;
      color: var(--text-2);
      line-height: 1.4;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .transcript-text.interim { color: var(--accent); font-style: italic; }
    .transcript-text.has-text { color: var(--text); }

    /* ── Steps feed ────────────────────────────────────────── */
    .steps-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .steps-area::-webkit-scrollbar { width: 3px; }
    .steps-area::-webkit-scrollbar-track { background: transparent; }
    .steps-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-2);
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .step-item.active {
      background: rgba(99,102,241,0.07);
      border-color: rgba(99,102,241,0.2);
      color: var(--text);
    }
    .step-item.done {
      color: var(--text-3);
    }
    .step-item.success {
      background: rgba(16,185,129,0.06);
      border-color: rgba(16,185,129,0.15);
      color: #6ee7b7;
    }
    .step-item.error {
      background: rgba(239,68,68,0.07);
      border-color: rgba(239,68,68,0.2);
      color: #fca5a5;
    }
    .step-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
      margin-top: 0px;
    }
    .step-item.active  .step-dot { background: var(--accent-dim); color: #a5b4fc; }
    .step-item.done    .step-dot { background: transparent; color: var(--text-3); }
    .step-item.success .step-dot { background: rgba(16,185,129,0.15); color: var(--success); }
    .step-item.error   .step-dot { background: rgba(239,68,68,0.15); color: var(--error); }
    .step-text { flex: 1; word-break: break-word; }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-3);
      pointer-events: none;
    }
    .empty-state .big-icon { font-size: 32px; opacity: 0.4; }
    .empty-state p { font-size: 12px; text-align: center; line-height: 1.6; max-width: 160px; }

    /* ── Controls ──────────────────────────────────────────── */
    .controls {
      padding: 12px 14px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* API warning */
    .api-warning {
      display: none;
      padding: 8px 12px;
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 8px;
      font-size: 11.5px;
      color: #fcd34d;
      text-align: center;
    }
    .api-warning a { color: #fcd34d; text-decoration: underline; cursor: pointer; }

    /* Mic button */
    .mic-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      color: #fff;
      box-shadow: 0 4px 20px rgba(99,102,241,0.3);
      position: relative;
      overflow: hidden;
    }
    .mic-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .mic-btn:hover::before { opacity: 1; }
    .mic-btn:active { transform: scale(0.97); }

    .mic-btn.listening {
      background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
      box-shadow: 0 4px 24px var(--red-glow), 0 0 0 0 var(--red-glow);
      animation: mic-ring 1.4s ease-out infinite;
    }
    .mic-btn.listening::before { opacity: 0; }
    @keyframes mic-ring {
      0%   { box-shadow: 0 4px 24px var(--red-glow), 0 0 0 0 var(--red-glow); }
      70%  { box-shadow: 0 4px 24px var(--red-glow), 0 0 0 14px rgba(239,68,68,0); }
      100% { box-shadow: 0 4px 24px var(--red-glow), 0 0 0 0 rgba(239,68,68,0); }
    }
    .mic-btn.disabled { background: var(--card); color: var(--text-3); box-shadow: none; cursor: not-allowed; }
    .mic-btn.disabled::before { display: none; }

    .mic-icon { font-size: 18px; position: relative; z-index: 1; }
    .mic-label { position: relative; z-index: 1; }

    /* Waveform bars (shown while listening) */
    .waveform {
      display: none;
      gap: 3px;
      align-items: center;
      height: 20px;
      position: relative;
      z-index: 1;
    }
    .mic-btn.listening .waveform { display: flex; }
    .mic-btn.listening .mic-icon { display: none; }
    .waveform span {
      width: 3px;
      border-radius: 3px;
      background: rgba(255,255,255,0.9);
      animation: wave 0.8s ease-in-out infinite;
    }
    .waveform span:nth-child(1) { height: 8px;  animation-delay: 0s; }
    .waveform span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
    .waveform span:nth-child(3) { height: 20px; animation-delay: 0.2s; }
    .waveform span:nth-child(4) { height: 14px; animation-delay: 0.3s; }
    .waveform span:nth-child(5) { height: 8px;  animation-delay: 0.4s; }
    @keyframes wave {
      0%,100% { transform: scaleY(0.5); opacity: 0.6; }
      50%      { transform: scaleY(1);   opacity: 1; }
    }

    /* Text row */
    .text-row {
      display: flex;
      gap: 7px;
    }
    .text-input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: var(--text);
      font-size: 12.5px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    .text-input::placeholder { color: var(--text-3); }
    .text-input:focus { border-color: var(--accent); background: #111122; }
    .text-input:disabled { opacity: 0.4; }
    .action-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .send-btn  { background: var(--accent); color: #fff; }
    .send-btn:hover  { background: #7c7ff7; }
    .stop-btn  { background: rgba(239,68,68,0.15); color: var(--error); border: 1px solid rgba(239,68,68,0.3); }
    .stop-btn:hover  { background: rgba(239,68,68,0.25); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <span class="logo-name">Browser<em>MCP</em></span>
      <span class="model-badge" id="modelBadge">gpt-5.1</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" title="Refresh content script in current tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Initialising…</span>
  </div>

  <!-- Transcript -->
  <div class="transcript-wrap">
    <span class="transcript-tag">Heard</span>
    <div class="transcript-text" id="transcriptEl">—</div>
  </div>

  <!-- Steps feed -->
  <div class="steps-area" id="stepsArea">
    <div class="empty-state" id="emptyState">
      <div class="big-icon">🎙️</div>
      <p>Hold the mic button and speak a command</p>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="api-warning" id="apiWarning">
      No API key — <a id="openOptionsLink">open Settings ⚙</a>
    </div>

    <button class="mic-btn" id="micBtn">
      <span class="mic-icon" id="micIcon">🎤</span>
      <div class="waveform">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <span id="micLabel">Hold to speak</span>
    </button>

    <div class="text-row">
      <input class="text-input" id="textInput" placeholder="Or type a command…" autocomplete="off" />
      <button class="action-btn send-btn" id="sendBtn" title="Send">↵</button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
