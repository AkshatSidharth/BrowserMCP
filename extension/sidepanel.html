<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrowserMCP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.3px;
    }
    .header-title span { color: #6c8ef7; }
    .settings-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .settings-btn:hover { color: #e8e8e8; }

    /* ── Status bar ── */
    .status-bar {
      padding: 8px 16px;
      font-size: 11px;
      color: #888;
      background: #141414;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .status-dot.ready   { background: #4caf50; }
    .status-dot.running { background: #ff9800; animation: pulse 1s infinite; }
    .status-dot.error   { background: #f44336; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Transcript ── */
    .transcript-area {
      padding: 10px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      min-height: 40px;
      flex-shrink: 0;
    }
    .transcript-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }
    .transcript-text {
      font-size: 13px;
      color: #d0d0d0;
      line-height: 1.4;
      min-height: 18px;
    }
    .transcript-text.interim { color: #888; font-style: italic; }

    /* ── Steps log ── */
    .steps-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .steps-area::-webkit-scrollbar { width: 4px; }
    .steps-area::-webkit-scrollbar-track { background: transparent; }
    .steps-area::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .step-item {
      padding: 6px 16px;
      font-size: 12px;
      line-height: 1.4;
      color: #aaa;
      border-left: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .step-item.active {
      color: #e8e8e8;
      border-left-color: #6c8ef7;
      background: rgba(108, 142, 247, 0.05);
    }
    .step-item.success { border-left-color: #4caf50; }
    .step-item.error   { border-left-color: #f44336; color: #ff8a80; }
    .step-icon { margin-right: 6px; }

    /* ── Controls ── */
    .controls {
      padding: 16px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      flex-shrink: 0;
    }

    /* Mic button */
    .mic-btn {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #6c8ef7;
      color: #fff;
    }
    .mic-btn:hover { background: #7c9ef8; transform: translateY(-1px); }
    .mic-btn:active { transform: translateY(0); }
    .mic-btn.listening {
      background: #f44336;
      animation: mic-pulse 1.5s infinite;
    }
    .mic-btn.disabled { background: #333; color: #666; cursor: not-allowed; }
    @keyframes mic-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(244,67,54,0.4); }
      50%      { box-shadow: 0 0 0 12px rgba(244,67,54,0); }
    }

    /* Text input fallback */
    .text-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .text-input {
      flex: 1;
      background: #252525;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
    }
    .text-input:focus { border-color: #6c8ef7; }
    .send-btn {
      background: #6c8ef7;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      padding: 8px 14px;
      font-weight: 600;
    }
    .send-btn:hover { background: #7c9ef8; }

    /* No API key warning */
    .api-warning {
      display: none;
      padding: 10px 16px;
      background: rgba(255,152,0,0.1);
      border: 1px solid rgba(255,152,0,0.3);
      border-radius: 8px;
      font-size: 12px;
      color: #ffb74d;
      margin-bottom: 10px;
      text-align: center;
    }
    .api-warning a { color: #ffb74d; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">Browser<span>MCP</span></div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button class="settings-btn" id="refreshBtn" title="Reload extension">↺</button>
      <button class="settings-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Initialising…</span>
  </div>

  <div class="transcript-area">
    <div class="transcript-label">Heard</div>
    <div class="transcript-text" id="transcriptEl">—</div>
  </div>

  <div class="steps-area" id="stepsArea"></div>

  <div class="controls">
    <div class="api-warning" id="apiWarning">
      No API key set. <a id="openOptionsLink">Add it in Settings ⚙️</a>
    </div>
    <button class="mic-btn" id="micBtn">
      <span id="micIcon">🎤</span>
      <span id="micLabel">Hold to speak</span>
    </button>
    <div class="text-row">
      <input class="text-input" id="textInput" placeholder="Or type a command…" />
      <button class="send-btn" id="sendBtn">↵</button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
