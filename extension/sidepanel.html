<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #161b27;
      --card:      #1c2233;
      --card-hi:   #1e2540;
      --border:    #232b3e;
      --border-hi: #2e3a5c;
      --accent:    #6366f1;
      --accent2:   #818cf8;
      --green:     #22c55e;
      --green-dim: #16a34a;
      --red:       #ef4444;
      --amber:     #f59e0b;
      --text:      #f1f5f9;
      --text-2:    #94a3b8;
      --text-3:    #475569;
      --text-heard:#e2e8f0;
    }

    html, body {
      height: 100%; width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .shell {
      display: flex; flex-direction: column;
      height: 100vh; width: 100%;
      background: var(--bg);
    }

    /* ── Header ──────────────────────────────────────────────── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 13px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    /* ── Orbital logo ── */
    .logo-icon {
      width: 44px; height: 44px; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    /* orbit rings */
    .orbit-ring {
      position: absolute; border-radius: 50%;
      border: 1.5px solid rgba(99,102,241,0.45);
    }
    .orbit-ring-1 {
      width: 44px; height: 44px;
      animation: orbit-rotate 6s linear infinite;
    }
    .orbit-ring-2 {
      width: 30px; height: 30px;
      border-color: rgba(99,102,241,0.3);
      animation: orbit-rotate 4s linear infinite reverse;
    }
    @keyframes orbit-rotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    /* core circle */
    .orbit-core {
      width: 22px; height: 22px; border-radius: 50%; z-index: 2;
      background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 10px rgba(99,102,241,0.6);
    }
    .orbit-core svg { width: 13px; height: 13px; }
    /* orbit dots */
    .orbit-dot {
      position: absolute; border-radius: 50%; z-index: 3;
    }
    .orbit-dot-green {
      width: 8px; height: 8px; background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      top: 2px; left: 50%; transform: translateX(-50%);
    }
    .orbit-dot-purple {
      width: 6px; height: 6px; background: #a78bfa;
      box-shadow: 0 0 5px #a78bfa;
      bottom: 2px; right: 4px;
    }
    .logo-text { display: flex; align-items: center; }
    .logo-name {
      font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.4px;
    }
    .header-btns { display: flex; gap: 6px; }
    .hbtn {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text-2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.18s;
    }
    .hbtn:hover { background: var(--card-hi); border-color: var(--border-hi); color: var(--text); }
    .hbtn:active { transform: scale(0.92); }
    .hbtn svg { width: 14px; height: 14px; }
    .hbtn.spinning svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Status bar ──────────────────────────────────────────── */
    .status-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sdot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: var(--text-3); transition: all 0.3s;
    }
    .sdot.ready   { background: var(--green); box-shadow: 0 0 7px var(--green); }
    .sdot.running { background: var(--amber); box-shadow: 0 0 7px var(--amber); animation: sdot-blink 1s ease-in-out infinite; }
    .sdot.error   { background: var(--red);   box-shadow: 0 0 7px var(--red); }
    @keyframes sdot-blink { 0%,100%{opacity:1} 50%{opacity:0.35} }
    .stext {
      font-size: 12px; font-weight: 600; color: var(--green); letter-spacing: 0.1px;
    }
    .stext.running { color: var(--amber); }
    .stext.error   { color: var(--red); }
    .stext.init    { color: var(--text-3); }

    /* ── HEARD row ───────────────────────────────────────────── */
    .heard-row {
      display: flex; align-items: baseline; gap: 10px;
      padding: 10px 16px 11px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; min-height: 42px;
    }
    .heard-tag {
      font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px;
      text-transform: uppercase; color: var(--accent2);
      flex-shrink: 0; padding-top: 2px;
    }
    .heard-text {
      font-size: 13px; font-weight: 600; color: var(--text-heard);
      line-height: 1.45; flex: 1;
      word-break: break-word;
    }
    .heard-text.interim { color: var(--accent2); font-style: italic; font-weight: 400; }
    .heard-text.empty   { color: var(--text-3); font-weight: 400; }

    /* ── Steps feed ──────────────────────────────────────────── */
    .steps-area {
      flex: 1; overflow-y: auto; padding: 8px 12px 6px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .steps-area::-webkit-scrollbar { width: 3px; }
    .steps-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* individual step row */
    .step-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 10px; border-radius: 10px;
      border: 1px solid transparent;
      font-size: 12.5px; line-height: 1.5; color: var(--text-2);
      animation: step-in 0.22s cubic-bezier(0.34,1.3,0.64,1) both;
    }
    @keyframes step-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    /* highlighted card — for plan lines and action lines */
    .step-item.card {
      background: var(--card-hi);
      border-color: var(--border-hi);
      color: var(--text);
    }
    .step-item.done   { color: var(--text-3); }
    .step-item.error  { background: rgba(239,68,68,0.07); border-color: rgba(239,68,68,0.2); color: #fca5a5; }

    /* circle check icon */
    .step-check {
      width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
      border: 1.5px solid currentColor;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px;
      color: var(--text-3);
    }
    .step-check svg { width: 10px; height: 10px; }
    /* spinning for active */
    .step-item.active .step-check {
      border-color: var(--accent2);
      color: var(--accent2);
      animation: check-spin 1.4s linear infinite;
    }
    @keyframes check-spin {
      0%,100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(0.85); opacity: 0.6; }
    }
    /* green for completed */
    .step-item:not(.active):not(.error) .step-check {
      border-color: var(--green);
      color: var(--green);
    }
    /* red for error */
    .step-item.error .step-check { border-color: var(--red); color: var(--red); }

    .step-text { flex: 1; word-break: break-word; }

    /* ── Empty / idle state ──────────────────────────────────── */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      padding-bottom: 24px; pointer-events: none;
    }
    .orb-wrap { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; }
    .orb-ring {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(99,102,241,0.2);
      animation: ring-out 3s ease-out infinite;
    }
    .orb-ring:nth-child(1) { width: 100%; height: 100%; animation-delay: 0s; }
    .orb-ring:nth-child(2) { width: 100%; height: 100%; animation-delay: 1s; }
    .orb-ring:nth-child(3) { width: 100%; height: 100%; animation-delay: 2s; }
    @keyframes ring-out {
      0%   { transform: scale(0.85); opacity: 0.7; }
      100% { transform: scale(1.85); opacity: 0; }
    }
    .orb-core {
      width: 58px; height: 58px; border-radius: 50%; position: relative; z-index: 1;
      background: radial-gradient(circle at 35% 30%, #818cf8, #6366f1 55%, #4338ca);
      box-shadow: 0 0 28px rgba(99,102,241,0.4);
      display: flex; align-items: center; justify-content: center; font-size: 24px;
      animation: orb-idle 3.5s ease-in-out infinite;
    }
    @keyframes orb-idle {
      0%,100% { transform: scale(1);    box-shadow: 0 0 24px rgba(99,102,241,0.35); }
      50%      { transform: scale(1.07); box-shadow: 0 0 38px rgba(99,102,241,0.55); }
    }
    body.listening .orb-core {
      background: radial-gradient(circle at 35% 30%, #f87171, #ef4444 55%, #dc2626);
      box-shadow: 0 0 36px rgba(239,68,68,0.55);
      animation: orb-listen 0.7s ease-in-out infinite alternate;
    }
    body.listening .orb-ring { border-color: rgba(239,68,68,0.2); }
    @keyframes orb-listen {
      from { transform: scale(1); } to { transform: scale(1.1); }
    }
    body.running .orb-core {
      background: radial-gradient(circle at 35% 30%, #fbbf24, #f59e0b 55%, #d97706);
      box-shadow: 0 0 36px rgba(245,158,11,0.5);
      animation: orb-think 1.1s ease-in-out infinite;
    }
    body.running .orb-ring { border-color: rgba(245,158,11,0.2); }
    @keyframes orb-think {
      0%,100% { transform: scale(1) rotate(0deg); }
      50%      { transform: scale(1.05) rotate(4deg); }
    }
    .empty-hint { font-size: 12px; color: var(--text-3); text-align: center; line-height: 1.6; max-width: 150px; }

    /* ── Bottom controls ─────────────────────────────────────── */
    .controls {
      padding: 11px 12px 13px;
      border-top: 1px solid var(--border);
      flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
    }
    .api-warn {
      display: none; padding: 7px 12px;
      background: rgba(245,158,11,0.07); border: 1px solid rgba(245,158,11,0.2);
      border-radius: 8px; font-size: 11px; color: #fcd34d; text-align: center;
    }
    .api-warn a { color: #fcd34d; text-decoration: underline; cursor: pointer; }

    /* mic button */
    .mic-btn {
      width: 100%; height: 50px; border-radius: 14px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 700; letter-spacing: 0.2px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(135deg, #5b5ef4 0%, #818cf8 100%);
      color: #fff; position: relative; overflow: hidden;
      box-shadow: 0 4px 20px rgba(91,94,244,0.4);
      transition: all 0.22s cubic-bezier(0.34,1.4,0.64,1);
    }
    .mic-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%);
      border-radius: inherit;
    }
    .mic-btn::after {
      content: '';
      position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: shimmer 3.5s ease-in-out infinite;
    }
    @keyframes shimmer { 0%{left:-100%} 50%,100%{left:160%} }
    .mic-btn:hover { transform: translateY(-1px); box-shadow: 0 7px 26px rgba(91,94,244,0.5); }
    .mic-btn:active { transform: scale(0.97); }
    .mic-btn.listening {
      background: linear-gradient(135deg, #dc2626 0%, #f87171 100%);
      box-shadow: 0 4px 22px rgba(220,38,38,0.45);
      animation: mic-pulse 0.85s ease-in-out infinite alternate;
    }
    .mic-btn.listening::after { display: none; }
    @keyframes mic-pulse {
      from { box-shadow: 0 4px 18px rgba(220,38,38,0.4); }
      to   { box-shadow: 0 6px 34px rgba(239,68,68,0.65); transform: translateY(-1px); }
    }
    .mic-icon { font-size: 18px; position: relative; z-index: 1; }
    .mic-label { position: relative; z-index: 1; }
    .waveform { display: none; gap: 3px; align-items: center; height: 20px; position: relative; z-index: 1; }
    .mic-btn.listening .waveform { display: flex; }
    .mic-btn.listening .mic-icon { display: none; }
    .waveform span {
      width: 3px; border-radius: 3px; background: rgba(255,255,255,0.9);
      animation: wv 0.6s ease-in-out infinite;
    }
    .waveform span:nth-child(1){height:6px; animation-delay:0s}
    .waveform span:nth-child(2){height:13px;animation-delay:0.1s}
    .waveform span:nth-child(3){height:20px;animation-delay:0.2s}
    .waveform span:nth-child(4){height:13px;animation-delay:0.3s}
    .waveform span:nth-child(5){height:6px; animation-delay:0.4s}
    @keyframes wv { 0%,100%{transform:scaleY(0.35);opacity:0.5} 50%{transform:scaleY(1);opacity:1} }

    /* text row */
    .text-row { display: flex; gap: 7px; align-items: center; }
    .text-input {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 12.5px;
      padding: 9px 13px; outline: none; transition: all 0.18s; font-family: inherit;
      height: 38px;
    }
    .text-input::placeholder { color: var(--text-3); }
    .text-input:focus { border-color: var(--accent); background: var(--card-hi); box-shadow: 0 0 0 2px rgba(99,102,241,0.12); }
    .text-input:disabled { opacity: 0.35; }
    .send-btn {
      width: 38px; height: 38px; border-radius: 10px; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #5b5ef4, #818cf8);
      color: #fff; flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(91,94,244,0.35);
      transition: all 0.18s;
    }
    .send-btn:hover { transform: scale(1.08); box-shadow: 0 4px 16px rgba(91,94,244,0.5); }
    .send-btn:active { transform: scale(0.94); }
    .send-btn svg { width: 15px; height: 15px; }
    .stop-btn {
      width: 38px; height: 38px; border-radius: 10px;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25);
      color: var(--red); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; transition: all 0.18s;
    }
    .stop-btn:hover { background: rgba(239,68,68,0.18); }
  </style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <div class="orbit-ring orbit-ring-1">
          <div class="orbit-dot orbit-dot-green"></div>
        </div>
        <div class="orbit-ring orbit-ring-2">
          <div class="orbit-dot orbit-dot-purple"></div>
        </div>
        <div class="orbit-core">
          <!-- snowflake / crystal icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="2" x2="12" y2="22"/>
            <path d="M17 7l-5-5-5 5"/>
            <path d="M17 17l-5 5-5-5"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M7 7l-5 5 5 5"/>
            <path d="M17 7l5 5-5 5"/>
          </svg>
        </div>
      </div>
      <div class="logo-text">
        <span class="logo-name">Casper</span>
      </div>
    </div>
    <div class="header-btns">
      <button class="hbtn" id="refreshBtn" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
      </button>
      <button class="hbtn" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <div class="sdot" id="statusDot"></div>
    <span class="stext init" id="statusText">Initialising…</span>
  </div>

  <!-- HEARD row -->
  <div class="heard-row">
    <span class="heard-tag">Heard</span>
    <div class="heard-text empty" id="transcriptEl">—</div>
  </div>

  <!-- Steps feed / Idle orb -->
  <div class="steps-area" id="stepsArea">
    <div class="empty-state" id="emptyState">
      <div class="orb-wrap">
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-core">🎙️</div>
      </div>
      <p class="empty-hint">Hold the mic and speak a command</p>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="api-warn" id="apiWarning">
      No API key — <a id="openOptionsLink">open Settings ⚙</a>
    </div>
    <button class="mic-btn" id="micBtn">
      <span class="mic-icon" id="micIcon">🎤</span>
      <div class="waveform"><span></span><span></span><span></span><span></span><span></span></div>
      <span class="mic-label" id="micLabel">Hold to speak</span>
    </button>
    <div class="text-row">
      <input class="text-input" id="textInput" placeholder="Or type a command…" autocomplete="off" />
      <button class="send-btn" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</div>
<script src="sidepanel.js"></script>
</body>
</html>
