<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BrowserMCP Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    h1 span { color: #6c8ef7; }
    .subtitle {
      font-size: 12px;
      color: #666;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    input[type=text], input[type=password] {
      width: 100%;
      background: #252525;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      margin-bottom: 16px;
      font-family: monospace;
    }
    input:focus { border-color: #6c8ef7; }
    .row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: #6c8ef7; color: #fff; }
    .btn-primary:hover { background: #7c9ef8; }
    .btn-secondary { background: #252525; color: #aaa; border: 1px solid #333; }
    .btn-secondary:hover { background: #2e2e2e; }
    .toast {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .toast.success { background: rgba(76,175,80,0.15); color: #81c784; border: 1px solid rgba(76,175,80,0.3); }
    .toast.error   { background: rgba(244,67,54,0.1);  color: #ef9a9a; border: 1px solid rgba(244,67,54,0.3); }
    .hint {
      font-size: 11px;
      color: #555;
      margin-top: -12px;
      margin-bottom: 16px;
    }
    .hint a { color: #6c8ef7; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Browser<span>MCP</span> Settings</h1>
    <p class="subtitle">Voice-controlled browser automation</p>

    <label for="apiKey">OpenAI API Key</label>
    <input type="password" id="apiKey" placeholder="sk-…" autocomplete="off" />
    <p class="hint">
      Get your key at <a href="https://platform.openai.com/api-keys" target="_blank">platform.openai.com</a>.
      Used for GPT-4o (agent) + Whisper (voice).
    </p>

    <label for="model">GPT Model</label>
    <input type="text" id="model" placeholder="gpt-4o" />
    <p class="hint">Default: gpt-4o. Use gpt-4o-mini for faster/cheaper.</p>

    <div class="row">
      <button class="btn btn-primary" id="saveBtn">Save</button>
      <button class="btn btn-secondary" id="clearBtn">Clear</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
